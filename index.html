<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>贪吃蛇 · Snake</title>
<style>
  :root{--bg:#0f1420;--panel:#181f2e;--accent:#3ddc84;--accent2:#1e88e5;--text:#e6edf3;--muted:#7d8799}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 20%,#16203a,#0a0e17);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
  h1{font-size:clamp(18px,4vw,24px);margin:0;letter-spacing:2px;font-weight:600;color:var(--text)}
  .hud{display:flex;gap:20px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
  .hud b{color:var(--accent);font-size:18px}
  .board{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 0 1px rgba(61,220,132,.15)}
  canvas{display:block;background:var(--panel);touch-action:none}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,14,23,.82);backdrop-filter:blur(4px);text-align:center;padding:20px}
  .overlay.hidden{display:none}
  .overlay h2{margin:0;font-size:clamp(16px,4vw,22px)}
  .overlay p{margin:0;color:var(--muted);font-size:14px;line-height:1.5;max-width:260px}
  button{background:linear-gradient(135deg,var(--accent),#28b866);color:#06210f;border:0;font-weight:700;font-size:16px;padding:12px 28px;border-radius:10px;cursor:pointer;box-shadow:0 6px 18px rgba(61,220,132,.3);transition:transform .08s}
  button:active{transform:scale(.96)}
  button.ghost{background:transparent;color:var(--accent);box-shadow:none;border:1px solid rgba(61,220,132,.4)}
  .ctrls{display:flex;gap:10px}
  .foot{color:var(--muted);font-size:12px;letter-spacing:1px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐍 贪吃蛇</h1>
  <div class="hud"><span>分数 <b id="score">0</b></span><span>最高 <b id="best">0</b></span></div>
  <div class="board">
    <canvas id="cv"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovt">准备开始</h2>
      <p id="ovp">方向键 / WASD 控制 · 手机滑屏</p>
      <button id="start">开始游戏</button>
    </div>
  </div>
  <div class="ctrls">
    <button class="ghost" id="pause">暂停</button>
    <button class="ghost" id="restart">重开</button>
  </div>
  <div class="foot">Snake · 无数据收集 · 纯本地运行</div>
</div>
<script>
(()=>{
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
  const ov=document.getElementById('ov'),ovt=document.getElementById('ovt'),ovp=document.getElementById('ovp');
  const N=20; let CELL=20, size=N*CELL;
  let snake,dir,nextDir,food,score,best,running,paused,loop;
  best=+(localStorage.getItem('snake_best')||0); bestEl.textContent=best;

  function fit(){
    const maxW=Math.min(window.innerWidth-32,460);
    const maxH=window.innerHeight-260;
    const side=Math.max(240,Math.min(maxW,maxH));
    size=Math.floor(side/N)*N; CELL=size/N;
    cv.width=size; cv.height=size;
    const dpr=window.devicePixelRatio||1;
    cv.style.width=size+'px'; cv.style.height=size+'px';
    cv.width=size*dpr; cv.height=size*dpr; ctx.scale(dpr,dpr);
    draw();
  }
  function reset(){
    snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];
    dir={x:1,y:0}; nextDir={x:1,y:0}; score=0; scoreEl.textContent=0;
    place(); draw();
  }
  function place(){
    do{food={x:(Math.random()*N)|0,y:(Math.random()*N)|0};}
    while(snake.some(s=>s.x===food.x&&s.y===food.y));
  }
  function draw(){
    if(!snake) return;
    ctx.clearRect(0,0,size,size);
    // grid
    ctx.strokeStyle='rgba(255,255,255,.03)'; ctx.lineWidth=1;
    for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,size);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(size,i*CELL);ctx.stroke();}
    // food
    ctx.fillStyle='#ff5d73'; const fx=food.x*CELL+CELL/2,fy=food.y*CELL+CELL/2;
    ctx.beginPath();ctx.arc(fx,fy,CELL*0.34,0,7);ctx.fill();
    ctx.shadowColor='#ff5d73';ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;
    // snake
    snake.forEach((s,i)=>{
      const t=i/Math.max(1,snake.length-1);
      ctx.fillStyle=i===0?'#3ddc84':`rgb(${Math.round(40+t*20)},${Math.round(200-t*70)},${Math.round(120)} )`;
      const r=i===0?CELL*0.34:CELL*0.26;
      const px=s.x*CELL+CELL/2,py=s.y*CELL+CELL/2;
      ctx.beginPath();ctx.arc(px,py,r,0,7);ctx.fill();
      if(i===0){ctx.fillStyle='#06210f';ctx.beginPath();ctx.arc(px+dir.x*3,py+dir.y*3,2.4,0,7);ctx.fill();}
    });
  }
  function step(){
    if(!running||paused) return;
    if(nextDir.x!==-dir.x||nextDir.y!==-dir.y) dir=nextDir;
    const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y)){return over();}
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){score++;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('snake_best',best);}place();}
    else snake.pop();
    draw();
  }
  function startGame(){
    reset();running=true;paused=false;ov.classList.add('hidden');
    clearInterval(loop);loop=setInterval(step,110);
  }
  function over(){
    running=false;clearInterval(loop);
    ovt.textContent='游戏结束';ovp.textContent='本局得分 '+score+' · 最高 '+best;
    document.getElementById('start').textContent='再来一局';ov.classList.remove('hidden');
  }
  function togglePause(){
    if(!running)return; paused=!paused;
    document.getElementById('pause').textContent=paused?'继续':'暂停';
  }
  document.getElementById('start').onclick=startGame;
  document.getElementById('restart').onclick=startGame;
  document.getElementById('pause').onclick=togglePause;
  window.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();
    if(k==='arrowup'||k==='w')nextDir={x:0,y:-1};
    else if(k==='arrowdown'||k==='s')nextDir={x:0,y:1};
    else if(k==='arrowleft'||k==='a')nextDir={x:-1,y:0};
    else if(k==='arrowright'||k==='d')nextDir={x:1,y:0};
    else if(k===' ')togglePause();
  });
  // touch swipe
  let tsx=0,tsy=0;
  cv.addEventListener('touchstart',e=>{const t=e.changedTouches[0];tsx=t.clientX;tsy=t.clientY;},{passive:true});
  cv.addEventListener('touchend',e=>{
    const t=e.changedTouches[0];const dx=t.clientX-tsx,dy=t.clientY-tsy;
    if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
    if(Math.abs(dx)>Math.abs(dy))nextDir={x:dx>0?1:-1,y:0};else nextDir={x:0,y:dy>0?1:-1};
  },{passive:true});
  window.addEventListener('resize',fit);
  fit();reset();
})();
</script>
</body>
</html>
